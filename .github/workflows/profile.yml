name: Verify Profile

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/*.svg"
      - "profile/**"
      - "scripts/build-profile.py"
      - ".github/workflows/profile.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/*.svg"
      - "profile/**"
      - "scripts/build-profile.py"
      - ".github/workflows/profile.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Regenerate profile assets
        run: python3 scripts/build-profile.py

      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          posters = sorted(Path("assets").glob("profile-poster-*.svg"))
          links = sorted(Path("assets").glob("link-*.svg"))
          if len(posters) != 4 or len(links) != 2:
              raise SystemExit(
                  f"expected 4 profile posters and 2 link buttons, "
                  f"found {len(posters)} and {len(links)}"
              )
          for asset in posters + links:
              ElementTree.parse(asset)
              print(f"valid {asset}")
          PY

      - name: Check generated assets are current
        run: git diff --exit-code -- assets/profile-poster-*.svg
